name: Build Shizuku Pro

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed APK to GitHub Releases
        type: boolean
        default: false

concurrency:
  group: shizuku-pro-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout source and pinned API submodule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Restore release signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('KEYSTORE', 'KEYSTORE_PASSWORD', 'KEYSTORE_ALIAS', 'KEYSTORE_ALIAS_PASSWORD')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Release signing secrets are missing. See docs/BUILDING.md.')
          Path('key.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          Path('signing.properties').write_text(
              'KEYSTORE_FILE=../key.jks\n' + ''.join(
                  name + '=' + escape(os.environ[name]) + '\n' for name in names[1:]), encoding='utf-8')
          os.chmod('key.jks', 0o600)
          os.chmod('signing.properties', 0o600)
          PY

      - name: Install pinned Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
          chmod +x gradlew

      - name: Test, lint and build release APK
        run: ./gradlew --no-daemon --stacktrace :manager:testReleaseUnitTest :manager:lintRelease :manager:assembleRelease

      - name: Prepare APK and checksums
        id: apk
        run: |
          mkdir -p artifacts
          cp manager/build/outputs/apk/release/*.apk artifacts/
          APK=$(find artifacts -maxdepth 1 -name '*.apk' -print -quit)
          VERSION=$(basename "$APK" | sed -E 's/^shizuku-pro-v(.*)-release\.apk$/\1/')
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shizuku-pro-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'This commit already has a release. Download its existing APK or build a new commit.'
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "Shizuku Pro $RELEASE_TAG" \
              --notes-file docs/RELEASE_NOTES.md
          fi

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            manager/build/reports/tests/
            manager/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -f key.jks signing.properties
