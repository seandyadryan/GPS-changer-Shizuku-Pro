name: nfx-location-pro
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      NFX_DATABASE_URL: ${NFX_DATABASE_URL:?Set NFX_DATABASE_URL}
      NFX_TRUST_PROXY: '1'
    networks:
      nfx:
        aliases: [nfx-location-api]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 6s
      retries: 3

networks:
  nfx:
    external: true
    name: nfx-location-pro
